[package]
name = "corkytux"
version = "3.2.0"
edition = "2021"
license-file = "LICENSE"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = { version = "0.20", features = ["v2_80"] }
gio = { version = "0.20" }
gdk-pixbuf = { version = "0.20" }
gdk = { package = "gdk4", version = "0.9" }
pango = { version = "0.20" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
url = "2"
regex = "1"
libc = "0.2"
# Solo la usa src/bin/webdriver_login.rs. Descomprime el Chromium que se
# descarga al primer uso. No se usa el `unzip` del sistema a proposito: seria un
# segundo modo de fallo sobre una descarga de 188 MB, y aqui el binario tiene
# que funcionar o el login no funciona.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Gamepad support (SDL_GameControllerDB mappings, hotplug). Apache-2.0/MIT.
# On Linux it needs libudev; CI installs libudev-dev.
gilrs = "=0.11.2"
# Playpad events from the input thread to the GTK main loop.
# System tray (StatusNotifierItem over D-Bus). Unlicense. No tokio: the
# launcher has no async runtime, so ksni runs with its async-io backend and
# the blocking API spawns its own thread.
ksni = { version = "=0.3.6", default-features = false, features = ["blocking", "async-io"] }
# Trait events from the tray thread to the GTK main loop.
async-channel = "=2.3.1"


[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
