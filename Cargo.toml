[package]
name = "corkytux"
version = "3.1.1"
edition = "2021"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
glib = { version = "0.20", features = ["v2_80"] }
gio = { version = "0.20" }
gdk-pixbuf = { version = "0.20" }
gdk = { package = "gdk4", version = "0.9" }
pango = { version = "0.20" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"
# Solo la usa src/bin/webdriver_login.rs. Descomprime el Chromium que se
# descarga al primer uso. No se usa el `unzip` del sistema a proposito: seria un
# segundo modo de fallo sobre una descarga de 188 MB, y aqui el binario tiene
# que funcionar o el login no funciona.
zip = { version = "2", default-features = false, features = ["deflate"] }


[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
